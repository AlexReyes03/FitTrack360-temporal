name: fit_track_360
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.4
  http: ^1.2.2
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.2
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/favicon.png
    - assets/brand/logo-no-bg.png
    - assets/brand/logo-complete.jpg

# Genera iconos de launcher Android e iOS desde el arte de marca.
# icon-master.png: emblema sobre fondo bgDeep, sin transparencia (iOS no admite alpha).
# icon-foreground.png: emblema con padding para la zona segura del adaptive icon.
flutter_launcher_icons:
  image_path: "assets/brand/icon-master.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#07080C"
  adaptive_icon_foreground: "assets/brand/icon-foreground.png"
