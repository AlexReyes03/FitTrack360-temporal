services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fittrack-api
    container_name: fittrack-api
    env_file:
      - .env
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://fittrack:fittrack@host.docker.internal:5432/fittrack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3001}:3001"

volumes:
  pgdata:
