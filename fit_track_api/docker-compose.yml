# Archivo docker-compose compartido del equipo.
# Miguel agregará api/mailpit en W8-07.
# Se inicia con 'docker compose up -d'.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fittrack_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fittrack_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fittrack} -d ${POSTGRES_DB:-fittrack_db}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
